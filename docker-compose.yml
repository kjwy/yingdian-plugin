services:
  yingdian-plugin:
    build: .
    image: yingdian-plugin:latest
    container_name: yingdian-plugin
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口（我用的是 8909，若冲突改冒号前面的数字）
      - "8909:8899"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # 先用模拟模式跑通界面，填好 Key + 装好 SDK 后改成 0
      - YDP_MOCK=1
