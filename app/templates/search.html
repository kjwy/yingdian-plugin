{% extends "base.html" %}
{% block content %}
<div class="panel">
  <div class="head">
    <h3>搜索并转存</h3>
    <span class="hint">TMDB ID 或片名，电影剧集自动识别</span>
  </div>
  <div class="row">
    <input id="q-tmdb" placeholder="TMDB ID 或片名，如 438631 / 沙丘" class="inp" style="flex:2">
    <input id="q-season" placeholder="季 可留空" class="inp" style="max-width:120px">
    <button class="btn primary" id="btn-search">查询资源</button>
  </div>
  <div id="search-result" class="results"></div>
</div>
{% endblock %}
